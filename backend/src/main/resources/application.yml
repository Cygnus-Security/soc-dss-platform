server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:strict}
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: soc-dss-backend
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:soc-dss-ingestion-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:socdss;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  correlation:
    time-window-minutes: ${CORRELATION_TIME_WINDOW_MINUTES:15}
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    normalized-topic: ${KAFKA_NORMALIZED_TOPIC:soc.normalized.v1}
    behavior-topic: ${KAFKA_BEHAVIOR_TOPIC:soc.behavior.v1}
    feedback-topic: ${KAFKA_FEEDBACK_TOPIC:soc.decision-feedback.v1}
    approved-action-topic: ${KAFKA_APPROVED_ACTION_TOPIC:soc.action-approved.v1}
    action-result-topic: ${KAFKA_ACTION_RESULT_TOPIC:soc.action-result.v1}
    dead-letter-topic: ${KAFKA_DLQ_TOPIC:soc.dlq.v1}
  response:
    approval-secret: ${ACTION_APPROVAL_SECRET:change-this-development-secret-32-characters}
    approval-ttl-minutes: ${ACTION_APPROVAL_TTL_MINUTES:10}
