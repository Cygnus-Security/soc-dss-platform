services:
  victim:
    image: tleemcjr/metasploitable2@sha256:e559450b37dccc1909eafa2df5b20bb052e1bd801246f4539a3ef183d5f7288a
    platform: linux/amd64
    container_name: soc-dss-metasploitable2-victim
    hostname: metasploitable2-victim
    command: ["bash", "-c", "/bin/services.sh; exec tail -f /dev/null"]
    tty: true
    stdin_open: true
    networks:
      attack_net:
        ipv4_address: ${METASPLOITABLE_VICTIM_IP:-172.31.252.20}
      control_net:
        ipv4_address: ${METASPLOITABLE_EXECUTOR_IP:-172.31.253.3}
    healthcheck:
      test: ["CMD-SHELL", "netstat -lnt 2>/dev/null | grep -q ':80 '"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  firewall_executor:
    build:
      context: ./firewall-executor
      dockerfile: Dockerfile
    container_name: soc-dss-metasploitable2-firewall
    network_mode: "service:victim"
    depends_on:
      victim:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      ACTION_WEBHOOK_TOKEN: ${SOAR_ACTION_WEBHOOK_TOKEN:?Set SOAR_ACTION_WEBHOOK_TOKEN in deploy/production/.env}
      ALLOWED_TARGET_IP: ${METASPLOITABLE_ATTACKER_IP:-172.31.252.10}
      SOAR_CONTROL_IP: ${METASPLOITABLE_SOAR_IP:-172.31.253.2}
      CONTROL_SUBNET: ${METASPLOITABLE_CONTROL_SUBNET:-172.31.253.0/29}
      BLOCK_TTL_SECONDS: ${METASPLOITABLE_BLOCK_TTL_SECONDS:-120}
      ACTION_AUDIT_FILE: /app/data/firewall-audit.jsonl
    volumes:
      - ./runtime/firewall:/app/data
    restart: unless-stopped

  test_client:
    image: alpine:3.20
    container_name: soc-dss-metasploitable2-client
    command: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 3600; done"]
    environment:
      METASPLOITABLE_VICTIM_IP: ${METASPLOITABLE_VICTIM_IP:-172.31.252.20}
    networks:
      attack_net:
        ipv4_address: ${METASPLOITABLE_ATTACKER_IP:-172.31.252.10}
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

networks:
  attack_net:
    name: soc-dss-metasploitable2-attack
    internal: true
    ipam:
      config:
        - subnet: ${METASPLOITABLE_ATTACK_SUBNET:-172.31.252.0/24}
  control_net:
    name: soc-dss-metasploitable2-control
    internal: true
    ipam:
      config:
        - subnet: ${METASPLOITABLE_CONTROL_SUBNET:-172.31.253.0/29}
